<li class="post-item">
  <a class="post-link" href="{{ post.url | relative_url }}">
    <h3>{{ post.title }}</h3>
    <p>{{ post.description | default: post.excerpt | strip_html | truncatewords: 38 }}</p>
    {% if post.tags.size > 0 %}<div class="tags">{% for t in post.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div>{% endif %}
  </a>
</li>
