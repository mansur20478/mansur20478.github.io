---
layout: default
---
<section class="hero">
  <img class="avatar" src="{{ site.avatar | relative_url }}" alt="Photo of {{ site.author }}">
  <div class="intro">
    <h1>{{ site.title }}</h1>
    <p class="tagline">{{ site.tagline }}</p>
    {% include social.html %}
  </div>
</section>

<section class="bio">
  {{ content }}
</section>

<section>
  <div class="section-head">
    <h2>Recent writing</h2>
    <a href="{{ '/blog/' | relative_url }}">All posts →</a>
  </div>
  <ul class="post-list">
    {% for post in site.posts limit: 5 %}{% include post-item.html %}{% endfor %}
  </ul>
</section>
